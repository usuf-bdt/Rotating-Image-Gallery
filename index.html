<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="banner">
        <div class="center-image">
            <img src="./assets/images/Adobe Express - file.png" alt="Center Image">
        </div>
        <div class="slider">
            <div class="item" style="--i: 1" data-title="Image 1"
                data-description="This is a beautiful landscape image showcasing nature's beauty. This is a beautiful landscape image showcasing nature's beauty. This is a beautiful landscape image showcasing nature's beauty."
                data-url="https://bdthemes.com/">
                <img src="./assets/images/01.jpg" alt="">
            </div>
            <div class="item" style="--i: 2" data-title="Image 2"
                data-description="A stunning architectural masterpiece with modern design elements."
                data-url="https://www.elementpack.pro/">
                <img src="./assets/images/02.jpg" alt="">
            </div>
            <div class="item" style="--i: 3" data-title="Image 3"
                data-description="Capturing the essence of urban life in a vibrant cityscape."
                data-url="https://pixelgallery.pro/">
                <img src="./assets/images/03.jpg" alt="">
            </div>
            <div class="item" style="--i: 4" data-title="Image 4"
                data-description="A serene natural environment perfect for relaxation and peace."
                data-url="https://bdthemes.com/">
                <img src="./assets/images/04.jpg" alt="">
            </div>
            <div class="item" style="--i: 5" data-title="Image 5"
                data-description="Exploring the wonders of technology and innovation."
                data-url="https://www.elementpack.pro/">
                <img src="./assets/images/05.jpg" alt="">
            </div>
            <div class="item" style="--i: 6" data-title="Image 6"
                data-description="A creative composition that tells a unique visual story."
                data-url="https://pixelgallery.pro/">
                <img src="./assets/images/01.jpg" alt="">
            </div>
            <div class="item" style="--i: 7" data-title="Image 7"
                data-description="Celebrating the diversity and beauty of different cultures."
                data-url="https://bdthemes.com/">
                <img src="./assets/images/02.jpg" alt="">
            </div>
            <div class="item" style="--i: 8" data-title="Image 8"
                data-description="A moment frozen in time, capturing pure emotion and expression."
                data-url="https://www.elementpack.pro/">
                <img src="./assets/images/03.jpg" alt="">
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="modal-image">
                <img id="modalImg" src="" alt="">
            </div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <button class="modal-btn" id="modalBtn">Learn More</button>
            </div>
        </div>
    </div>

    <!-- Rotation Control Panel -->
    <div class="rotation-controls">
        <div class="control-panel">
            <h3>Gallery Controls</h3>
            
            <!-- Speed Control -->
            <div class="control-group">
                <label for="rotationSpeed">Speed:</label>
                <input type="range" id="rotationSpeed" min="5" max="60" value="30" class="slider-control" aria-label="Rotation speed control">
                <span id="speedValue">30s</span>
            </div>
            
            <!-- Style Control -->
            <div class="control-group">
                <label for="rotationStyle">Style:</label>
                <select id="rotationStyle" class="style-select">
                    <option value="linear">Linear</option>
                    <option value="ease-in-out">Smooth</option>
                    <option value="cubic-bezier(0.34, 1.56, 0.64, 1)">Bounce</option>
                    <option value="cubic-bezier(0.25, 0.46, 0.45, 0.94)">Gentle</option>
                    <option value="cubic-bezier(0.19, 1, 0.22, 1)">Premium</option>
                </select>
            </div>
            
            <!-- Rotation Effect Control -->
            <div class="control-group">
                <label for="rotationEffect">Rotation Effect:</label>
                <select id="rotationEffect" class="style-select">
                    <option value="normal">Normal</option>
                    <option value="floating">Floating</option>
                    <option value="pulse">Pulse</option>
                    <option value="orbit">Orbit</option>
                    <option value="spiral">Spiral</option>
                </select>
            </div>
            
            <!-- Direction Control -->
            <div class="control-group">
                <label>Direction:</label>
                <div class="direction-buttons">
                    <button id="clockwise" class="direction-btn active">↻ Clockwise</button>
                    <button id="counterclockwise" class="direction-btn">↺ Counter</button>
                </div>
            </div>
            
            <!-- Custom Angle Control -->
            <div class="control-group">
                <label for="customAngle">Custom Angle:</label>
                <div class="angle-controls">
                    <input type="number" id="customAngle" class="angle-input" min="0" max="360" value="45" placeholder="45" aria-label="Custom rotation angle">
                    <button id="rotateToAngle" class="angle-btn" aria-label="Rotate to custom angle">Rotate</button>
                </div>
            </div>
            
            <!-- Play/Pause Control -->
            <div class="control-group">
                <button id="playPause" class="play-pause-btn">▶️ Auto Play</button>
            </div>
            

            
            <!-- Navigation Buttons -->
            <div class="control-group">
                <button id="prevBtn" class="nav-btn">⏮️ Previous Item</button>
                <button id="nextBtn" class="nav-btn">⏭️ Next Item</button>
            </div>
            
            <!-- Additional Controls -->
            <div class="control-group">
                <label>Quick Actions:</label>
                <div class="quick-actions">
                    <button id="resetBtn" class="quick-btn">🔄 Reset</button>
                    <button id="fullscreenBtn" class="quick-btn">⛶ Fullscreen</button>
                    <button id="infoBtn" class="quick-btn">ℹ️ Info</button>
                </div>
            </div>
            
            <!-- Gallery Info -->
            <div class="control-group">
                <div class="gallery-info">
                    <span id="currentItem">Item: 1/8</span>
                    <span id="currentAngle">Angle: 0°</span>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
